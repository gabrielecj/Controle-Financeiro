<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Financeiro</title><link rel="stylesheet" href="style.css"></head><body><aside><b>meu<span>saldo</span></b><small>CONTROLE PESSOAL</small><nav>Resumo<br>Movimentações<br>Orçamento</nav></aside><main><header><div><small>SETEMBRO 2026</small><h1>Dashboard Financeiro</h1><p>Controle simples para entender o que entrou, saiu e o que ainda está disponível.</p></div><button onclick="openForm()">+ Nova movimentação</button></header><section id="cards"></section><div class="grid"><article><h2>Fluxo financeiro</h2><div id="chart"></div></article><article><h2>Despesas por categoria</h2><div id="cats"></div></article></div><article><h2>Movimentações</h2><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Data</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody id="rows"></tbody></table></article></main><div id="modal"><form onsubmit="save(event)"><button type="button" class="x" onclick="closeForm()">×</button><h2>Nova movimentação</h2><label>Descrição<input id="desc" required></label><label>Categoria<input id="cat" required></label><label>Valor<input id="amount" type="number" step=".01" min=".01" required></label><label>Tipo<select id="type"><option value="expense">Despesa</option><option value="income">Receita</option></select></label><label>Data<input id="date" type="date" required></label><button>Salvar</button><p id="err"></p></form></div><script src="app.js"></script></body></html>
